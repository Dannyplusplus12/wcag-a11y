<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>A11y Test Fixture</title></head>
<body>
  <!-- img-alt violations -->
  <img src="photo.jpg" id="missing-alt">
  <img src="icon.png" alt="" role="img" id="decorative-needs-label">
  <input type="image" src="submit.png" id="input-image-no-alt">

  <!-- img with alt (valid) -->
  <img src="logo.png" alt="Company Logo" id="valid-img">

  <!-- SVG without title -->
  <svg id="svg-no-title" width="100" height="100">
    <circle cx="50" cy="50" r="40"/>
  </svg>

  <!-- color contrast violations -->
  <p id="low-contrast" style="color: #aaa; background: #fff; font-size: 14px;">
    Light gray text on white — fails 4.5:1
  </p>
  <p id="large-text-ok" style="color: #767676; background: #fff; font-size: 24px; font-weight: bold;">
    Large bold text — passes 3:1
  </p>

  <!-- keyboard violations -->
  <div onclick="doSomething()" id="div-click">Click me</div>
  <button tabindex="5" id="positive-tabindex">Bad tab order</button>
  <button tabindex="0" id="valid-tabindex">Good tab order</button>
</body>
</html>
