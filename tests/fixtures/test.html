<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>A11y Test Fixture</title></head>
<body>
  <!-- img-alt violations -->
  <img src="photo.jpg" id="missing-alt">
  <img src="icon.png" alt="" role="img" id="decorative-needs-label">
  <input type="image" src="submit.png" id="input-image-no-alt">

  <!-- img with alt (valid) -->
  <img src="logo.png" alt="Company Logo" id="valid-img">

  <!-- SVG without title -->
  <svg id="svg-no-title" width="100" height="100">
    <circle cx="50" cy="50" r="40"/>
  </svg>

  <!-- color contrast violations -->
  <p id="low-contrast" style="color: #aaa; background: #fff; font-size: 14px;">
    Light gray text on white — fails 4.5:1
  </p>
  <p id="large-text-ok" style="color: #767676; background: #fff; font-size: 24px; font-weight: bold;">
    Large bold text — passes 3:1
  </p>

  <!-- keyboard violations -->
  <div onclick="doSomething()" id="div-click">Click me</div>
  <button tabindex="5" id="positive-tabindex">Bad tab order</button>
  <button tabindex="0" id="valid-tabindex">Good tab order</button>

  <!-- form violations -->
  <form>
    <input type="text" id="no-label" placeholder="Name">
    <label for="labeled-input">Email</label>
    <input type="email" id="labeled-input">
    <label></label>
    <input type="text" id="empty-label-input">
    <input type="text" id="required-no-attr">
    <input type="text" id="valid-required" required aria-required="true">
  </form>

  <!-- ARIA violations -->
  <div role="invalid-role" id="bad-role">Bad role</div>
  <div role="checkbox" id="checkbox-no-checked">No aria-checked</div>
  <div role="button" id="div-button-no-name"></div>
  <button id="empty-button"></button>
  <div aria-hidden="true" tabindex="0" id="hidden-but-focusable">Hidden but focusable</div>

  <!-- structure violations -->
  <h1>Page Title</h1>
  <h3 id="skipped-heading">Skipped h2</h3>
  <li id="orphan-li">Orphan list item</li>
  <main>
    <p>Main content</p>
  </main>

  <!-- link violations -->
  <a href="/page" id="empty-link"></a>
  <a href="/page" id="click-here">Click here</a>
  <a href="/page" id="valid-link">View accessibility report</a>

  <!-- media violations -->
  <video id="video-no-captions" src="video.mp4" controls></video>
  <audio id="audio-no-transcript" src="audio.mp3" controls></audio>
</body>
</html>
